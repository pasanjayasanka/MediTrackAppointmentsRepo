apiVersion: apps/v1
kind: Deployment
metadata:
  name: appointment-service-blue
spec:
  replicas: 1
  selector:
    matchLabels:
      app: appointment-service-blue
  template:
    metadata:
      labels:
        app: appointment-service-blue
    spec:
      containers:
      - name: appointment-service
        image: 225989377732.dkr.ecr.us-east-1.amazonaws.com/medi_track_appointment:blue
        ports:
        - containerPort: 5000
        env:
        - name: DB_USERNAME
          valueFrom:
            secretKeyRef:
              name: db-credentials
              key: username
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-credentials
              key: password
